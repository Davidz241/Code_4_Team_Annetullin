<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deno Multiplayer</title>
  <script src="client.js" defer type="module"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.8);
      --panel-border: rgba(148, 163, 184, 0.2);
      --primary: #38bdf8;
      --primary-strong: #0284c7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --button: #1e293b;
      --button-hover: #334155;
      --shadow: rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #172554 0%, var(--bg) 45%, #020617 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .game-shell {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 20px 50px var(--shadow);
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2vw, 2rem);
      letter-spacing: 0.04em;
      color: var(--text);
    }

    #controls {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(15, 23, 42, 0.6);
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--button), #0f172a);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 16px rgba(15,23,42,0.35);
    }

    .control-btn:hover {
      background: linear-gradient(180deg, var(--button-hover), #0f172a);
      transform: translateY(-1px);
    }

    .control-btn:active {
      transform: translateY(1px);
    }

    .canvas-wrap {
      display: flex;
      justify-content: center;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 18px;
    }

    canvas {
      display: block;
      max-width: 100%;
      width: 600px;
      height: auto;
      border: 2px solid rgba(56, 189, 248, 0.6);
      background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
    }

    @media (max-width: 520px) {
      .game-shell { padding: 14px; }
      .topbar { justify-content: center; }
      #controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <h1>Multiplayer Positionen</h1>
      <div id="controls" aria-label="Steuerung">
        <button class="control-btn" id="left" aria-label="Links">&#8592;</button>
        <button class="control-btn" id="right" aria-label="Rechts">&#8594;</button>
        <button class="control-btn" id="up" aria-label="Hoch">&#8593;</button>
        <button class="control-btn" id="down" aria-label="Runter">&#8595;</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="600" height="400"></canvas>
    </div>
  </div>
</body>
</html>
